name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
    tags:
      - 'v*'  # Also run CI on version tags
  pull_request:
    branches: [main, devel]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "latest"

      # Ubuntu 26.04 ships GCC 16.0.1, whose reflection support miscompiles this
      # code. GCC 16.1.0 fixes it but Ubuntu has no newer package, so pull the
      # gcc-16 family from Debian sid. Pin priority 990 keeps only those packages
      # (and their runtime libs) from Debian.
      - name: Install gcc-16 (16.1.0) from Debian
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends debian-archive-keyring

          echo "deb [signed-by=/usr/share/keyrings/debian-archive-keyring.gpg] http://deb.debian.org/debian sid main" \
            | sudo tee /etc/apt/sources.list.d/debian-sid.list

          printf 'Package: *\nPin: release o=Debian\nPin-Priority: 100\n\nPackage: gcc-16 gcc-16-* g++-16 g++-16-* cpp-16 cpp-16-* gcc-16-base libgcc-16-dev libstdc++-16-dev libstdc++6 libgcc-s1 libgomp1 libitm1 libatomic1 libquadmath0 libcc1-0 libasan8 libubsan1 liblsan0 libtsan2 libhwasan0\nPin: release o=Debian\nPin-Priority: 990\n' \
            | sudo tee /etc/apt/preferences.d/debian

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-16 g++-16

          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-16 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-16 100

          gcc --version

      - name: Install UV dependencies
        run: uv sync

      - name: Configure Conan settings for GCC 16
        run: |
          mkdir -p ~/.conan2
          printf 'compiler:\n  gcc:\n    version: ["16"]\n' > ~/.conan2/settings_user.yml

      - name: Build and test
        run: |
            uv run pcons generate REFLEX_BUILD_TESTS=ON
            uv run pcons build
            uv run pcons test
